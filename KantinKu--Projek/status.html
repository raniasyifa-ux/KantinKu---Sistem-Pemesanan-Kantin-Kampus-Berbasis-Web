<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pesanan - KantinKu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-portal="pembeli">

    <header class="navbar" data-app-header data-page="status"></header>

    <main class="container" data-protected-page="pembeli">
        <h1>Status Pesanan KantinKu</h1>

        <div class="status-card">
            <h2>Detail Pesanan</h2>
            <div id="detailPesanan" class="summary-box"></div>

            <hr>

            <h2>Status Pesanan</h2>
            <div>
                <span id="statusPesanan">Menunggu Pembayaran</span>
            </div>

            <div class="action-buttons" style="margin-top: 20px;">
                <a class="btn-secondary" href="menu.html">Pesan Lagi</a>
            </div>

            <hr>

            <h2>Pesanan Aktif</h2>
            <div id="pesananAktif" class="summary-box"></div>

            <hr>

            <h2>Riwayat Pesanan</h2>
            <div id="riwayatPesanan" class="summary-box"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 KantinKu. Hak Cipta Dilindungi.</p>
    </footer>

    <script src="script.js"></script>
    <script src="status.js"></script>
