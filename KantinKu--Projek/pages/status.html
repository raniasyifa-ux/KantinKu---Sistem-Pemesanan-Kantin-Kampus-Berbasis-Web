<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pesanan - KantinKu</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h1>Kantin<span>Ku</span></h1>
        </div>
        <nav class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../pages/menu.html">Menu <span id="cart-badge" class="badge" style="display:none;">0</span></a>
            <a href="../pages/pembayaran.html">Pembayaran</a>
            <a href="status.html" class="active">Status Pemesanan</a>
        </nav>
        <div class="nav-auth">
            <a href="../pages/auth.html" class="btn-login">Login</a>
        </div>
    </header>

    <main class="container">
        <h1>Status Pesanan KantinKu</h1>

        <div class="status-card">
            <h2>Detail Pesanan</h2>
            <div id="detailPesanan" class="summary-box"></div>

            <hr>

            <h2>Status Pesanan</h2>
            <div>
                <span id="statusPesanan">Menunggu Pembayaran</span>
            </div>

            <div class="action-buttons" style="margin-top: 20px;">
                <button class="btn-primary" onclick="ubahStatus()">Perbarui Status</button>
                <button class="btn-secondary" onclick="kembaliKeHome()">Kembali ke Home</button>
            </div>

            <hr>

            <h2>Pesanan Aktif</h2>
            <div id="pesananAktif" class="summary-box"></div>

            <hr>

            <h2>Riwayat Pesanan</h2>
            <div id="riwayatPesanan" class="summary-box"></div>
        </div>
    </main>

    <div id="detailOrderModal" class="detail-overlay" style="display: none;" onclick="if (event.target.id === 'detailOrderModal') tutupDetailPesanan();">
        <div class="detail-modal">
            <button class="detail-close" onclick="tutupDetailPesanan()" aria-label="Tutup detail">×</button>
            <h2 id="detailOrderTitle">Detail Pesanan</h2>
            <div id="detailOrderContent" class="detail-content"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 KantinKu. Hak Cipta Dilindungi.</p>
    </footer>

    <script src="../js/script.js"></script>
    <script src="../js/status.js"></script>
</body>
</html>
