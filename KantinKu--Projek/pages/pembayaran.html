<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KantinKu - Pembayaran</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-portal="pembeli">

    <header class="navbar" data-app-header data-page="payment"></header>

    <main class="container" data-protected-page="pembeli">
        <h1>Pembayaran KantinKu</h1>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Silakan periksa pesanan dan pilih metode pembayaran.</p>

        <div class="pembayaran-card">
            <h2>Ringkasan Pesanan</h2>
            <div id="ringkasanPesanan" class="summary-box" style="margin-top: 15px;"></div>

            <hr>

            <h2>Metode Pembayaran</h2>
            <div class="payment-methods">
                <label class="payment-option">
                    <input type="radio" name="metode" value="QRIS"> QRIS
                </label>
                <label class="payment-option">
                    <input type="radio" name="metode" value="Tunai"> Tunai / COD
                </label>
                <label class="payment-option">
                    <input type="radio" name="metode" value="Transfer Bank"> Transfer Bank
                </label>
            </div>

            <div class="total-container">
                <h3>Total Pembayaran: <span id="totalPembayaran" style="color: var(--primary-btn);">Rp0</span></h3>
            </div>

            <div class="action-buttons" style="margin-top: 25px;">
                <button class="btn-primary" onclick="konfirmasiPembayaran()">Konfirmasi Pembayaran</button>
                <button class="btn-secondary" onclick="kembaliKeHome()">Kembali</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 KantinKu. Hak Cipta Dilindungi.</p>
    </footer>

    <script src="../js/script.js"></script>
    <script src="../js/pembayaran.js"></script>
</body>
</html>
