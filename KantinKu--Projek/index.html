<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KantinKu -- Profil KantinKu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>KantinKu</h1>
    <p class="subtitle">Pilihan Fitur KantinKu</p>

    <div class="fitur-container">
        <div class="fitur-card">
        <img src="menu.jpg" alt="KLIK HERE TO MENU">

        <div class="fitur-content">
            <h2>MENU KANTINKU</h2>
            <p>Klik disini untuk menemukan makanan dan minuman yang ada di KantinKu</p>
        </div>

        <div class="fitur-footer">
            <button id="btnMenu">MASUK KE HALAMAN MENU</button>
            
        </div>
    </div>


    <div class="fitur-card">
        <img src="pembayaran.jpg" alt="KLIK HERE TO BAYAR">

        <div class="fitur-content">
            <h2>TAGIHAN KANTINKU</h2>
            <p>Klik disini untuk membayar pesananmu di KantinKu</p>
        </div>

        <div class="fitur-footer">
            <button id="btnBayar">MASUK KE HALAMAN PEMBAYARAN</button>
        </div>
    </div>

   
    <div class="fitur-card">
        <img src="status.jpg" alt="KLIK HERE TO STATUS">

        <div class="fitur-content">
            <h2>STATUS KANTINKU</h2>
            <p>Klik disini untuk melihat makanan dan minuman yang sudah dipesan.</p>
        </div>

        <div class="fitur-footer">
            <button id="btnStatus">MASUK KE HALAMAN STATUS</button>
        </div>
    </div>
    </div>
        </div>

    <!-- Pop-up -->
    <div id="popup" class="popup">
        <div class="popup-box">
            <h2 id="popupTitle"></h2>
            <p id="popupMessage"></p>
            <button id="btnClose">OKE</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
    


</body>
</html>
